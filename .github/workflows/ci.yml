name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portable:
    name: Portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@127.0.0.1:5433/price_monitor?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm verify:portable

  integration:
    name: Linux integration
    needs: portable
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: price_monitor
          POSTGRES_USER: price_monitor
          POSTGRES_PASSWORD: price_monitor_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U price_monitor -d price_monitor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://price_monitor:price_monitor_dev@127.0.0.1:5433/price_monitor?schema=public
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6380
      SETTINGS_MASTER_KEY: placeholder-ci-master-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm verify
